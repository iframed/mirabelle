<div class="container">
    <h2 class="text-center my-4">Formulaire de connexion</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" class="form-control" placeholder="Entrez votre email" />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger">
          Email invalide.
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" formControlName="password" type="password" class="form-control" placeholder="Entrez votre mot de passe" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger">
          Le mot de passe est requis.
        </div>
      </div>
  
      <div class="text-center">
        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Se connecter</button>
      </div>
    </form>
  
    <p class="text-center text-danger mt-3">{{ message }}</p>
  </div>
